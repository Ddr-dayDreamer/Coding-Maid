<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} data: blob:; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Maid</title>
    <link rel="stylesheet" href="{{cssUri}}" />
    <link rel="stylesheet" href="{{bundleCssUri}}" />
  </head>
  <body>
    <div id="app"></div>
    <script nonce="{{nonce}}">
      window.workspaceRoot = {{workspaceRoot}};
    </script>
    <script nonce="{{nonce}}" src="{{bundleJsUri}}"></script>
  </body>
</html>
